name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Headless Chromium with software WebGL boots the game, drives, lets the autopilot
      # play the steal/crash/wreck loop and asserts it all happened without page errors.
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-frame
          path: screenshots/_work/smoke.png
          if-no-files-found: ignore
